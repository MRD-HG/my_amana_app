plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def mapsApiKey = project.findProperty("MAPS_API_KEY") ?: ""

android {
    namespace = "com.example.my_amana_app"
    // Some plugins (e.g. shared_preferences_android, url_launcher_android) now
    // require compiling against Android SDK 35.
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId "com.example.my_amana_app"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode flutter.versionCode
        versionName flutter.versionName
        // Required because AndroidManifest.xml uses android:name="${applicationName}".
        // If you don't need a custom Application class, Flutter's default works.
        manifestPlaceholders = [
                MAPS_API_KEY: mapsApiKey,
                applicationName: "io.flutter.app.FlutterApplication"
        ]
    }

    buildTypes {
        release {
            // TODO: Add your own signing config for the release build.
            // Signing with the debug keys for now, so `flutter run --release` works.
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
