plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def mapsApiKey = project.findProperty("MAPS_API_KEY") ?: ""

// Release signing: create android/key.properties (never commit it):
//   storeFile=/absolute/path/upload-keystore.jks
//   storePassword=...
//   keyAlias=upload
//   keyPassword=...
// Without it, release builds fall back to the debug key (local testing only).
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace = "com.example.my_amana_app"
    // Some plugins (e.g. shared_preferences_android, url_launcher_android) now
    // require compiling against Android SDK 35.
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Unique store ID (Play Store rejects com.example.*). The Kotlin namespace
        // can stay com.example.my_amana_app; only applicationId is published.
        applicationId "com.mrdhg.myamana"
        minSdkVersion 23
        targetSdkVersion 35
        versionCode flutter.versionCode
        versionName flutter.versionName
        // Mutating the map keeps the placeholders injected by the Flutter Gradle plugin
        // (including applicationName). The old code replaced the whole map and
        // pointed applicationName to io.flutter.app.FlutterApplication, a class
        // removed with the v1 embedding in recent Flutter versions.
        manifestPlaceholders["MAPS_API_KEY"] = mapsApiKey
    }

    signingConfigs {
        if (keystorePropertiesFile.exists()) {
            release {
                storeFile = file(keystoreProperties["storeFile"])
                storePassword = keystoreProperties["storePassword"]
                keyAlias = keystoreProperties["keyAlias"]
                keyPassword = keystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        release {
            signingConfig = keystorePropertiesFile.exists()
                    ? signingConfigs.release
                    : signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}
