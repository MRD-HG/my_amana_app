name: my_amana_app
description: "My Amana (Barid Al-Maghrib) - shipment tracking, agencies, tariffs. Offline demo data (JSON + SharedPreferences)."
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI / UX
  flutter_spinkit: ^5.2.1
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0+3
  flutter_boxicons: ^3.2.0
  google_fonts: ^6.2.1
  dropdown_button2: ^2.3.9

  # Maps + Scan
  google_maps_flutter: ^2.10.0
  simple_barcode_scanner: ^0.3.0

  # Local storage + external links
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/phone.json
    - assets/data/
