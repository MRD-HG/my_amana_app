name: my_amana_app
description: "My Amana (Poste Maroc) - local JSON PURE (no Firebase) v2."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # UI / UX
  flutter_spinkit: ^5.2.1
  sliding_up_panel: ^2.0.0+1
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^1.2.0+3
  flutter_boxicons: ^3.2.0
  google_fonts: ^6.2.1
  dropdown_button2: ^2.3.9

  # Maps + Scan
  google_maps_flutter: ^2.10.0
  simple_barcode_scanner: ^0.3.0

  # Local storage + QR + external links
  shared_preferences: ^2.2.2
  qr_flutter: ^4.1.0
  url_launcher: ^6.2.6

  # (Optional) PDF viewer if used in your UI
  flutter_pdfview: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/scroller1.jpg
    - assets/phone.json
    - assets/data/
