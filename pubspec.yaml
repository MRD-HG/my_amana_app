name: my_amana_app
description: "My Amana (Barid Al-Maghrib) - shipment tracking, agencies, tariffs. Offline demo data (JSON + SharedPreferences)."
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^2.0.0

  # UI / UX
  flutter_spinkit: ^5.2.1
  carousel_slider: ^5.0.0
  smooth_page_indicator: ^3.0.0
  flutter_boxicons: ^3.2.0
  google_fonts: ^8.0.0

  # Maps + Scan
  google_maps_flutter: ^2.10.0
  simple_barcode_scanner: ^0.6.1

  # Local storage + external links
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/phone.json
    - assets/data/
